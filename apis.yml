aid: kingsware
name: Kingsware
description: >-
  Kingsware (Zhuhai Kingsware Artificial Intelligence Co., Ltd. / 珠海金智维人工智能股份有限公司)
  is a leading Chinese enterprise AI and RPA solutions provider that builds "AI digital
  employees" and enterprise-grade agent platforms by fusing large language models, AI
  algorithms, and robotic process automation with vertical industry workflows. Its core
  products are the K-APA intelligent process automation (RPA) platform and the Ki-Agent
  enterprise agent platform (built around a "Supervised Agent" model with task planning,
  tool calling, multi-agent collaboration, and result verification), exposed through the
  Kingsware AI Open Platform (ai.kingsware.cn). The company serves finance, government,
  manufacturing, energy, telecom, education, HR, and finance/operations use cases; it has
  been recognized by IDC as the number-one China RPA+AI solution vendor by market share,
  counts all six major state-owned banks and 1,300+ enterprise/government customers, has
  deployed over 1.8 million AI digital employees, and is a national-level "little giant"
  (专精特新) enterprise. Added to the API Evangelist network as a portfolio company of the
  venture firm Qiming and enriched by the pipeline.
